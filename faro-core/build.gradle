plugins {
    id 'java-library'
    id 'maven-publish'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/Olamyy/faro'
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

dependencies {
    api 'org.apache.avro:avro:1.12.1'
    api 'com.fasterxml.jackson.core:jackson-databind:2.21.2'

    implementation 'org.apache.kafka:kafka-clients:3.9.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.opentelemetry:opentelemetry-api:1.47.0'
    implementation 'io.opentelemetry:opentelemetry-sdk:1.47.0'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp:1.47.0'
    implementation 'org.slf4j:slf4j-api:2.0.16'
}
